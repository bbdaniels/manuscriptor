[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manuscriptor"
version = "0.1.0"
description = "A live manuscript editor: LaTeX rendered to an addressable, commentable page backed by its own sources"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Benjamin Daniels", email = "bdaniels@g.harvard.edu" }]
license = { text = "MIT" }
dependencies = [
    # The HTTP server, the routes and the websocket the live page holds open are
    # all aiohttp. It is imported at module scope in `server/app.py`, so an
    # install without it fails at `manuscriptor serve`, not at some later branch.
    "aiohttp>=3.9",
    "pylatexenc>=2.10",
    "bibtexparser>=1.4",
    "anthropic>=0.40",
    "jinja2>=3.1",
    # Reads annotations out of a marked-up PDF: quadpoints back to the text a
    # referee actually highlighted, with line wrapping and hyphenation handled.
    # Chosen over pypdf and PyMuPDF because it sits on pdfminer.six, which is
    # already a dependency here, so it adds no new transitive tree at all -- and
    # because the author's own pdf-comments skill already standardises on it and
    # records what a hand-rolled extraction gets wrong.
    "pdfannots>=0.4",
    "pdfminer.six>=20231228",
    "pyzotero>=1.5",
    "requests>=2.31",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
manuscriptor = "manuscriptor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manuscriptor*"]

[tool.setuptools.package-data]
manuscriptor = ["templates/*.j2", "templates/static/*", "templates/static/ext/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["docs"]
